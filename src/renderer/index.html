<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadTime</title>
  <style>
    @font-face {
      font-family: "ReadTime Ma Shan Zheng";
      src: url("../../assets/fonts/MaShanZheng-Regular.ttf") format("truetype");
      font-display: swap;
    }
    @font-face {
      font-family: "ReadTime ZCOOL XiaoWei";
      src: url("../../assets/fonts/ZCOOLXiaoWei-Regular.ttf") format("truetype");
      font-display: swap;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    #root {
      width: 100%;
      height: 100vh;
    }

    .draggable {
      -webkit-app-region: drag;
    }

    .non-draggable {
      -webkit-app-region: no-drag;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
